name: Actualizador Semanal de Jackpot Cultural

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-culture:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Extraer prensa abierta, charts de Apple y libros
        run: node scripts/fetch-data.js

      - name: Guardar y publicar la nueva edicion
        run: |
          git config --global user.name "Robot Semanal"
          git config --global user.email "bot@jackpotcultural.com"
          git add data/weekly.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Edición Semanal [Auto]" && git push)
